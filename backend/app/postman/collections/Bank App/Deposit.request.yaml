$kind: http-request
method: POST
url: '{{baseUrl}}/api/accounts/{{accountId}}/deposit'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "amount": 500.00
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has id, userId, balance, accountType, createdAt", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("userId");
          pm.expect(json).to.have.property("balance");
          pm.expect(json).to.have.property("accountType");
          pm.expect(json).to.have.property("createdAt");
      });

      pm.test("Balance increased by deposit amount", function () {
          const json = pm.response.json();
          pm.expect(json.balance).to.be.at.least(500);
      });

      pm.test("Save balance to environment", function () {
          const json = pm.response.json();
          pm.environment.set("accountBalance", json.balance);
      });
