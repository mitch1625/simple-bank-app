$kind: http-request
method: GET
url: '{{baseUrl}}/api/accounts/{{accountId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has id, userId, balance, accountType, createdAt", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("userId");
          pm.expect(json).to.have.property("balance");
          pm.expect(json).to.have.property("accountType");
          pm.expect(json).to.have.property("createdAt");
      });

      pm.test("id matches accountId environment variable", function () {
          const json = pm.response.json();
          pm.expect(json.id).to.eql(pm.environment.get("accountId"));
      });
